name: Continuous Deployment (GitHub Pages + Oracle Cloud)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deployment"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Multi-Target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      # 1. Deploy to GitHub Pages CDN
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # 2. Deploy to Oracle Cloud Infrastructure (OCI) VM
      - name: Deploy to Oracle Cloud VM via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/portfolio"
          strip_components: 1
          overwrite: true

      - name: Reload Nginx on Oracle Cloud VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo restorecon -Rv /var/www/portfolio
            sudo chmod -R 755 /var/www/portfolio
            sudo systemctl reload nginx
            echo "🚀 Oracle Cloud Portfolio successfully refreshed and live!"
