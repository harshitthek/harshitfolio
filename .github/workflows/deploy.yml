name: Enterprise Multi-Stage CI/CD & Verification Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deployment"
  cancel-in-progress: true

jobs:
  # ── STAGE 1: FRONTEND CODE QUALITY & SECURITY ──
  security-and-lint:
    name: 🛡️ Code Quality, ESLint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint Code Analysis
        run: npm run lint

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=moderate || true

  # ── STAGE 2: PYTHON & ML QUALITY WITH RUFF ──
  python-ruff-quality:
    name: ⚡ Python & ML Quality (Ruff Linter & Formatter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Code Formatter Check
        run: ruff format --check .

  # ── STAGE 3: COMPREHENSIVE TEST MATRIX (VITEST) ──
  unit-and-integration-tests:
    name: 🧪 Vitest Test Matrix (Schemas, VFS, Terminals & Sound)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Execute Vitest Test Matrix
        run: npm test

  # ── STAGE 4: PRODUCTION BUILD & MULTI-TARGET DEPLOYMENT ──
  build-and-deploy:
    name: 🚀 Production Build & Dual Deployment (Pages + Oracle VM)
    needs: [security-and-lint, python-ruff-quality, unit-and-integration-tests]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile Optimized Production Bundle
        run: npm run build

      # 1. Deploy to GitHub Pages CDN
      - name: Deploy to GitHub Pages CDN
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # 2. Deploy to Oracle Cloud Infrastructure (OCI) VM
      - name: Deploy to Oracle Cloud VM (144.24.104.31) via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/portfolio"
          strip_components: 1
          overwrite: true

      - name: Hot-Reload Nginx & Validate Security on Oracle VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo restorecon -Rv /var/www/portfolio
            sudo chmod -R 755 /var/www/portfolio
            sudo systemctl reload nginx
            echo "🚀 Oracle Cloud Portfolio refreshed and live with 100% verified CI/CD pass!"
