# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "You are reviewing HARSHIT.EXE — an interactive AI & systems engineering developer portfolio built with React 18, Vite 5, HTML5 Canvas 2D, Web Audio API, and Biome 2.5. Provide concise, high-signal reviews focusing on performance, memory leaks, hook dependencies, and security."

early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "master"
      - "main"
  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!*.lock"
    - "!package-lock.json"
  path_instructions:
    - path: "src/components/**/*.jsx"
      instructions: "Verify React 18 hook dependency arrays, TDZ ordering, cleanup functions in useEffect, and ensure state updates do not trigger unnecessary React component re-renders."
    - path: "src/components/modals/TerminalModal.jsx"
      instructions: "Review the 60-120FPS Canvas 2D Snake & Terminal engine. Ensure pre-rendered offscreen background buffers are maintained and input queues remain zero-lag."
    - path: "src/components/SoundFX.js"
      instructions: "Verify Web Audio API context resume lifecycle and try...catch guards on all LocalStorage operations."
    - path: "src/components/VoiceContext.jsx"
      instructions: "Ensure Web Speech API synthesis handles voice pitch/rate cleanly with speech synthesis cancellation on unmount."
    - path: "src/__tests__/**/*.js*"
      instructions: "Ensure Vitest unit and integration test assertions match exact physics presets and component schemas without external network calls."

chat:
  auto_reply: true
